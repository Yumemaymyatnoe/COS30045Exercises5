<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COS30045 Exercise 5 - D3 Multi-chart Webpage</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- D3.js v7 CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <h1>Exercise 5: D3 Multi-chart Webpage</h1>

    <!-- 5.1 Bar Chart Container -->
    <section class="chart-container">
        <h2>5.1 Vertical Bar Chart with Axis</h2>
        <div id="bar-chart"></div>
    </section>
    <script src="js/script5_1.js"></script>

    <!-- 5.2 Line/Scatter Chart Container -->
    <section class="chart-container">
        <h2>5.2 Scatter Plot and Line Chart</h2>
        <div id="line-chart"></div>
    </section>
    <script src="js/script5_2.js"></script>

    <!-- 5.3 Donut Chart Container -->
    <section class="chart-container">
        <h2>5.3 Donut Chart</h2>
        <div id="donut-chart"></div>
    </section>
    <script src="js/script5_3.js"></script>
